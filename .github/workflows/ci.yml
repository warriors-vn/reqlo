name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # jsdom 30 (added for the component test layer) requires Node
          # ^22.22.2 || ^24.15.0 || >=26 — 20 is below its supported range,
          # which fails jsdom's *.test.tsx files at worker startup in CI.
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build

      - run: npm run check:bundle-size

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # jsdom 30 (added for the component test layer) requires Node
          # ^22.22.2 || ^24.15.0 || >=26 — 20 is below its supported range,
          # which fails jsdom's *.test.tsx files at worker startup in CI.
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
